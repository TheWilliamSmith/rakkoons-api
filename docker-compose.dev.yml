services:
  rakkoons-api-dev:
    container_name: rakkoons-api-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - .env
    depends_on:
      rakkoons-database-dev:
        condition: service_healthy
    ports:
      - '8080:8080'
    volumes:
      - .:/app
      - rakkoons-api-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - rakkoons-dev-network

  rakkoons-database-dev:
    image: postgres:15
    container_name: rakkoons-database-dev
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - '5432'
    volumes:
      - rakkoons-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rakkoons-dev-network

networks:
  rakkoons-dev-network:
    driver: bridge

volumes:
  rakkoons-db-data:
  rakkoons-api-node-modules:
